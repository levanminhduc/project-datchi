############################################################
# Đất Chỉ - Docker Compose (Pull từ GHCR)
# Dùng cho máy deploy — KHÔNG cần clone source
#
# Setup:
#   1. docker login ghcr.io -u <GITHUB_USER> -p <PAT>
#   2. Copy file này + tạo .env.docker (xem .env.docker.example)
#   3. docker compose -f docker-compose.ghcr.yml --env-file .env.docker up -d
#
# Update:
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml --env-file .env.docker up -d
#
# Pin version (thay latest bằng tag cụ thể):
#   IMAGE_TAG=v1.2.0 docker compose -f docker-compose.ghcr.yml --env-file .env.docker up -d
############################################################

services:
  frontend:
    image: ghcr.io/levanminhduc/datchi-frontend:${IMAGE_TAG:-latest}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  backend:
    image: ghcr.io/levanminhduc/datchi-backend:${IMAGE_TAG:-latest}
    init: true
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3010}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_DIR: ${STORAGE_DIR:-/data/storage}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      CHATBOT_SERVICE_URL: ${CHATBOT_SERVICE_URL:-http://ai-assistant:8010}
      CHATBOT_INTERNAL_TOKEN: ${CHATBOT_INTERNAL_TOKEN:-}
      CHATBOT_REQUEST_TIMEOUT_MS: ${CHATBOT_REQUEST_TIMEOUT_MS:-28000}
    volumes:
      - ${STORAGE_HOST_DIR:-./storage}:${STORAGE_DIR:-/data/storage}
    restart: unless-stopped

  ai-assistant:
    image: ghcr.io/levanminhduc/ai-assistant-service:${AI_IMAGE_TAG:-latest}
    init: true
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      AI_EFFORT: ${AI_EFFORT:-low}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-4096}
      AI_MAX_ROUNDS: ${AI_MAX_ROUNDS:-5}
      AI_CALL_TIMEOUT_S: ${AI_CALL_TIMEOUT_S:-12}
      AI_TOTAL_TIMEOUT_S: ${AI_TOTAL_TIMEOUT_S:-25}
      APP_REQUEST_TIMEOUT_S: ${APP_REQUEST_TIMEOUT_S:-12}
      APPS: datchi
      APP_DATCHI_BASE_URL: http://backend:3000
      APP_DATCHI_INTERNAL_TOKEN: ${CHATBOT_INTERNAL_TOKEN:-}
    volumes:
      - ${AI_LOG_HOST_DIR:-./ai-logs}:/app/logs
    restart: unless-stopped
