############################################################
# Đất Chỉ - Docker Compose (FE + BE only)
# Dùng PostgreSQL thuần (trỏ qua DATABASE_URL); không còn Supabase.
#
# Usage:
#   docker compose --env-file .env.docker up --build -d
############################################################

services:
  # ── Frontend (nginx) ──────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  # ── Backend (Hono API) ────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "${BACKEND_PORT:-3010}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_DIR: ${STORAGE_DIR:-/data/storage}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      CHATBOT_SERVICE_URL: ${CHATBOT_SERVICE_URL:-}
      CHATBOT_INTERNAL_TOKEN: ${CHATBOT_INTERNAL_TOKEN:-}
      CHATBOT_REQUEST_TIMEOUT_MS: ${CHATBOT_REQUEST_TIMEOUT_MS:-15000}
    volumes:
      - guide_storage:${STORAGE_DIR:-/data/storage}
    restart: unless-stopped

volumes:
  guide_storage:
